<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katko | AI &amp; Technology Solutions — NourDoc, LeadHive AI &amp; Engineering</title>
    <meta name="description" content="Katko delivers modern, enterprise-ready AI solutions, ambient clinical documentation with NourDoc, omnichannel lead intelligence with LeadHive AI, and bespoke software engineering." />
    <meta name="keywords" content="Katko, NourDoc, LeadHive AI, AI solutions, clinical documentation, healthcare AI, lead automation, South Africa software engineering, enterprise AI" />
    <meta name="author" content="Katko" />
    <meta property="og:title" content="Katko | AI &amp; Technology Solutions" />
    <meta property="og:description" content="Turn complex challenges into practical digital solutions with Katko's AI products and engineering services." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://katko.co.za" />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#20272D" />
    
    <!-- Typography: Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Premium Preloader — pure HTML/CSS, no React dependency -->
    <div id="katko-preloader" style="position:fixed;inset:0;background:#ffffff;z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:all;">
      <div style="position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(243,140,19,0.08) 0%,rgba(255,255,255,0) 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;"></div>
      <div style="position:relative;display:flex;flex-direction:column;align-items:center;z-index:2;">
        <div style="margin-bottom:1.5rem;">
          <img src="/logo.png" alt="Katko" style="height:48px;width:auto;display:block;filter:drop-shadow(0 4px 12px rgba(243,140,19,0.15));" />
        </div>
        <div style="width:160px;height:3px;background:rgba(226,232,240,0.8);border-radius:9999px;overflow:hidden;position:relative;margin-bottom:1rem;">
          <div id="katko-progress-bar" style="position:absolute;top:0;bottom:0;width:60%;background:linear-gradient(90deg,transparent,#F38C13,#FF9F2D,transparent);border-radius:9999px;animation:katko-shimmer 1.1s cubic-bezier(0.65,0,0.35,1) infinite;"></div>
        </div>
        <div style="font-size:0.72rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#64748B;font-family:Inter,sans-serif;">Enterprise AI &amp; Engineering</div>
      </div>
    </div>
    <style>
      @keyframes katko-shimmer {
        from { transform: translateX(-200%); }
        to   { transform: translateX(400%); }
      }
      #katko-preloader {
        transition: opacity 0.65s cubic-bezier(0.16,1,0.3,1);
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
